function renderSummary(view) {
    const formatter = metricDef().formatter;
    const state = appState.selectedState;
    let cards;
    if (view.kind === "flows") {
        cards = [
            { label: "Sold to other states", value: formatter(view.summary.outbound), note: "Visible outbound" },
            { label: "Bought from other states", value: formatter(view.summary.inbound), note: "Visible inbound" },
            { label: "Net", value: formatter(view.summary.net), note: "Sold minus bought" },
            { label: "Partner states", value: d3.format(",")(view.summary.partners.length), note: "Matching the filters" }
        ];
    } else if (appState.report === "dependency") {
        const profile = view.profile;
        const top = ranked(profile.suppliers)[0];
        cards = [
            { label: "Total purchases", value: formatter(profile.total), note: industryLabel(appState.industry) },
            { label: "Foreign imports", value: pct(ratio(profile.imports, profile.total)), note: formatter(profile.imports) + " from other countries" },
            { label: "From other states", value: pct(ratio(profile.other, profile.total)), note: formatter(profile.other) + (top ? ", most from " + stateLabel(top.code) : "") },
            { label: "Supplier concentration", value: REPORT_MEASURES.dependency.supplierHHI.format(hhi(profile.suppliers)), note: "HHI of supplying states" }
        ];
    } else {
        const profile = view.profile;
        const strongest = quotientFor(state, ALL);
        const quotient = quotientFor(state, appState.industry);
        cards = [
            appState.industry === ALL
                ? { label: "Strongest specialization", value: strongest ? titleCase(strongest.code) : "-", note: strongest ? REPORT_MEASURES.advantage.lq.format(strongest.quotient) + " the US share" : "" }
                : { label: "Location quotient", value: quotient ? REPORT_MEASURES.advantage.lq.format(quotient.quotient) : "-", note: industryLabel(appState.industry) + " share of GDP vs US" },
            { label: "Sold to other states", value: formatter(profile.sold), note: pct(ratio(profile.sold, profile.usSales)) + " of US interstate sales" },
            { label: "Interstate balance", value: signedPct(ratio(profile.sold - profile.other, profile.sold + profile.other)), note: formatter(profile.sold - profile.other) + " net" },
            { label: "Specializations", value: String((appState.flows.specializations[state] || []).length), note: "Industries at 1.25× the US share or more" }
        ];
    }
    document.getElementById("summary-strip").innerHTML = cards.map(function (card) {
        return '<div class="summary-card"><span class="summary-label">' + escapeHtml(card.label) + "</span>" +
            '<div class="summary-value">' + escapeHtml(card.value) + "</div>" +
            '<div class="summary-note">' + escapeHtml(card.note) + "</div></div>";
    }).join("");
}

// ---- Reports below the map: an ECharts chart and a Tabulator table each ----

const charts = {};
const tables = {};
const barMax = { lq: 1, share: 1 };

function chartFor(id) {
    if (!charts[id]) charts[id] = echarts.init(document.getElementById(id));
    return charts[id];
}

function chartTheme() {
    return {
        text: cssVar("--dep-muted") || "#64748b",
        strong: cssVar("--dep-text") || "#0f172a",
        grid: isDark() ? "rgba(255,255,255,0.08)" : "rgba(15,23,42,0.07)"
    };
}

// A Tabulator table from earthscape_TableDisplay, created once and then given new rows
function setTableData(key, my, rows) {
    if (typeof earthscape_TableDisplay !== "function") {
        document.getElementById(my.elementID).textContent = "Tables need localsite/js/earthscape.js.";
        return;
    }
    if (!tables[key]) {
        tables[key] = earthscape_loadTabulator().then(function () {
            return new Promise(function (resolve) {
                const table = earthscape_TableDisplay(Object.assign({ maxHeight: "420px", layout: "fitColumns" }, my), []);
                table.on("tableBuilt", function () { resolve(table); });
                if (my.onRowClick) table.on("rowClick", function (event, row) { my.onRowClick(row.getData()); });
            });
        });
    }
    tables[key].then(function (table) {
        table.setData(rows);
        table.redraw();
    });
}

function downloadTable(key, filename) {
    if (tables[key]) tables[key].then(function (table) { table.download("csv", filename); });
}

function barFormatter(color, format, maxKey) {
    return function (cell) {
        const value = cell.getValue();
        if (!Number.isFinite(value)) return "-";
        const width = Math.max(0, Math.min(100, value / (barMax[maxKey] || 1) * 100));
        return '<div class="cell-bar"><span class="cell-bar-track"><span class="cell-bar-fill" style="width:' + width +
            "%;background:" + (typeof color === "function" ? color(value) : color) + '"></span></span><span class="cell-bar-label">' + format(value) + "</span></div>";
    };
}

function metricColumn(title, field) {
    return {
        title: title,
        field: field,
        hozAlign: "right",
        sorter: "number",
        formatter: function (cell) { return metricDef().formatter(cell.getValue()); }
    };
}

function renderPartnerReport(view) {
    const panel = document.getElementById("partnerPanel");
    panel.hidden = view.kind !== "flows";
    if (panel.hidden) return;
    const state = stateLabel(appState.selectedState);
    const partners = view.summary.partners.filter(function (partner) { return appState.visiblePartners.has(partner.code); });
    const top = partners.slice(0, 12);
    const theme = chartTheme();
    document.getElementById("partner-title").textContent = "Top Partner States for " + state;
    document.getElementById("partner-note").textContent = metricDef().label + " traded with " + state +
        (appState.industry === ALL ? "" : " in " + industryLabel(appState.industry)) + ", ranked by the total of both directions. Click a state to focus on it.";
    const chart = chartFor("partner-chart");
    chart.setOption({
        animationDuration: 250,
        grid: { left: 110, right: 24, top: 10, bottom: 24 },
        tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, valueFormatter: metricDef().formatter },
        xAxis: { type: "value", axisLabel: { color: theme.text }, splitLine: { lineStyle: { color: theme.grid } } },
        yAxis: { type: "category", inverse: true, axisTick: { show: false }, axisLine: { show: false }, axisLabel: { color: theme.strong },
            data: top.map(function (partner) { return stateLabel(partner.code); }) },
        series: [{
            type: "bar",
            barWidth: 14,
            data: top.map(function (partner) { return { value: partner.total, itemStyle: { color: partnerColor(partner) } }; }),
            itemStyle: { borderRadius: [0, 6, 6, 0] }
        }]
    }, true);
    chart.off("click");
    chart.on("click", function (params) { setFilters({ selectedState: top[params.dataIndex].code }); });
    chart.resize();

    setTableData("partner", {
        elementID: "partner-table",
        index: "code",
        initialSort: [{ column: "total", dir: "desc" }],
        tableOptions: { placeholder: "No partner states match the current filters." },
        columns: [
            { title: "State", field: "name", minWidth: 120 },
            metricColumn("Sold to", "outbound"),
            metricColumn("Bought from", "inbound"),
            metricColumn("Net", "net"),
            metricColumn("Total", "total")
        ],
        onRowClick: function (row) { setFilters({ selectedState: row.code }); }
    }, partners.map(function (partner) {
        return { code: partner.code, name: stateLabel(partner.code), outbound: partner.outbound, inbound: partner.inbound, net: partner.outbound - partner.inbound, total: partner.total };
    }));
}

function industryRows() {
    const state = appState.selectedState;
    return appState.industries.map(function (code) {
        const profile = stateProfile(state, code);
        const supplier = ranked(profile.suppliers)[0];
        const buyer = ranked(profile.dests)[0];
        const quotient = quotientFor(state, code);
        return {
            code: code,
            industry: industryLabel(code),
            total: profile.total,
            instate: profile.instate,
            other: profile.other,
            imports: profile.imports,
            instateShare: ratio(profile.instate, profile.total),
            otherShare: ratio(profile.other, profile.total),
            importShare: ratio(profile.imports, profile.total),
            supplierHHI: hhi(profile.suppliers),
            topSupplier: supplier ? stateLabel(supplier.code) : "-",
            topSupplierShare: supplier ? ratio(supplier.value, profile.other) : null,
            lq: quotient ? quotient.quotient : null,
            gdp: quotient ? quotient.gdp : null,
            sold: profile.sold,
            balance: ratio(profile.sold - profile.other, profile.sold + profile.other),
            usShare: ratio(profile.sold, profile.usSales),
            topBuyer: buyer ? stateLabel(buyer.code) : "-"
        };
    });
}

function renderDependencyReport(rows) {
    const panel = document.getElementById("dependencyPanel");
    panel.hidden = appState.report === "advantage";
    if (panel.hidden) return;
    const state = stateLabel(appState.selectedState);
    const theme = chartTheme();
    document.getElementById("dependency-title").textContent = "Import Dependency for " + state;
    document.getElementById("dependency-note").textContent = "Where " + state + "'s purchases come from by supplying industry: its own producers, other states, or imports from other countries. " +
        metricDef().label + ", " + DATA_YEAR + ". Click a row to map that industry.";
    const sorted = rows.slice().sort(function (a, b) { return (b.importShare || 0) - (a.importShare || 0); });
    const series = [
        { key: "instateShare", name: "In-state", color: cssVar("--instate") },
        { key: "otherShare", name: "Other states", color: cssVar("--inbound") },
        { key: "importShare", name: "Imports", color: cssVar("--imports") }
    ];
    const chart = chartFor("dependency-chart");
    chart.setOption({
        animationDuration: 250,
        legend: { top: 0, left: 0, icon: "roundRect", itemWidth: 10, itemHeight: 10, textStyle: { color: theme.text } },
        grid: { left: 110, right: 16, top: 32, bottom: 24 },
        tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, valueFormatter: pct },
        xAxis: { type: "value", max: 1, axisLabel: { color: theme.text, formatter: function (value) { return d3.format(".0%")(value); } }, splitLine: { lineStyle: { color: theme.grid } } },
        yAxis: { type: "category", inverse: true, axisTick: { show: false }, axisLine: { show: false }, axisLabel: { color: theme.strong },
            data: sorted.map(function (row) { return row.industry; }) },
        series: series.map(function (entry) {
            return { type: "bar", name: entry.name, stack: "mix", barWidth: 16, itemStyle: { color: entry.color },
                data: sorted.map(function (row) { return row[entry.key] || 0; }) };
        })
    }, true);
    chart.off("click");
    chart.on("click", function (params) { setFilters({ industry: sorted[params.dataIndex].code }); });
    chart.resize();

    const mix = function (cell) {
        const row = cell.getRow().getData();
        return '<div class="mix-bar" title="In-state ' + pct(row.instateShare) + " | Other states " + pct(row.otherShare) + " | Imports " + pct(row.importShare) + '">' +
            series.map(function (entry) { return '<span style="width:' + ((row[entry.key] || 0) * 100) + "%;background:" + entry.color + '"></span>'; }).join("") + "</div>";
    };
    setTableData("dependency", {
        elementID: "dependency-table",
        index: "code",
        initialSort: [{ column: "importShare", dir: "desc" }],
        columns: [
            { title: "Industry", field: "industry", minWidth: 120, frozen: true },
            { title: "Sourcing mix", field: "mix", headerSort: false, minWidth: 110, formatter: mix },
            metricColumn("Purchases", "total"),
            { title: "Imports", field: "importShare", minWidth: 120, sorter: "number", formatter: barFormatter(cssVar("--imports"), pct, "share") },
            { title: "Other states", field: "otherShare", minWidth: 120, sorter: "number", formatter: barFormatter(cssVar("--inbound"), pct, "share") },
            { title: "Top supplier", field: "topSupplier", minWidth: 110 },
            { title: "Its share", field: "topSupplierShare", hozAlign: "right", sorter: "number", formatter: function (cell) { return pct(cell.getValue()); } },
            { title: "HHI", field: "supplierHHI", hozAlign: "right", sorter: "number", formatter: function (cell) { return REPORT_MEASURES.dependency.supplierHHI.format(cell.getValue()); } }
        ],
        onRowClick: function (row) { setFilters({ industry: row.code }); }
    }, rows);
}

// report=advantage shows only this report and report=dependency hides it. The flows view shows it with the toggle.
function advantageReportShown() {
    return appState.report === "advantage" || (appState.report === "flows" && appState.showAdvantage);
}

function renderAdvantageReport(rows) {
    const panel = document.getElementById("advantagePanel");
    panel.hidden = !advantageReportShown();
    if (panel.hidden) return;
    const state = stateLabel(appState.selectedState);
    const theme = chartTheme();
    const lqFormat = REPORT_MEASURES.advantage.lq.format;
    document.getElementById("advantage-title").textContent = "Competitive Advantage for " + state;
    document.getElementById("advantage-note").textContent = "Industries where " + state + " specializes (location quotient above 1) and sells more to other states than it buys from them. " +
        "Location quotients come from BEA GDP by state; sales use " + metricDef().label.toLowerCase() + ", " + DATA_YEAR + ".";
    const sorted = rows.slice().sort(function (a, b) { return (b.lq || 0) - (a.lq || 0); });
    barMax.lq = d3.max(rows, function (row) { return row.lq; }) || 1;
    const lqColor = function (value) { return value >= 1 ? "#059669" : "#6366f1"; };
    const chart = chartFor("advantage-chart");
    chart.setOption({
        animationDuration: 250,
        grid: { left: 110, right: 40, top: 10, bottom: 24 },
        tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, valueFormatter: lqFormat },
        xAxis: { type: "value", axisLabel: { color: theme.text, formatter: function (value) { return value + "×"; } }, splitLine: { lineStyle: { color: theme.grid } } },
        yAxis: { type: "category", inverse: true, axisTick: { show: false }, axisLine: { show: false }, axisLabel: { color: theme.strong },
            data: sorted.map(function (row) { return row.industry; }) },
        series: [{
            type: "bar",
            barWidth: 16,
            data: sorted.map(function (row) { return { value: row.lq || 0, itemStyle: { color: lqColor(row.lq || 0) } }; }),
            itemStyle: { borderRadius: [0, 6, 6, 0] },
            label: { show: true, position: "right", color: theme.text, formatter: function (params) { return lqFormat(params.value); } },
            markLine: { symbol: "none", silent: true, label: { formatter: "US average", position: "end", color: theme.text }, lineStyle: { color: theme.text, type: "dashed" }, data: [{ xAxis: 1 }] }
        }]
    }, true);
    chart.off("click");
    chart.on("click", function (params) { setFilters({ industry: sorted[params.dataIndex].code }); });
    chart.resize();

    setTableData("advantage", {
        elementID: "advantage-table",
        index: "code",
        initialSort: [{ column: "lq", dir: "desc" }],
        columns: [
            { title: "Industry", field: "industry", minWidth: 120, frozen: true },
            { title: "Location quotient", field: "lq", minWidth: 140, sorter: "number", formatter: barFormatter(lqColor, lqFormat, "lq") },
            { title: "GDP ($M)", field: "gdp", hozAlign: "right", sorter: "number", formatter: function (cell) { return Number.isFinite(cell.getValue()) ? d3.format(",.0f")(cell.getValue()) : "-"; } },
            metricColumn("Sold to states", "sold"),
            metricColumn("Bought from states", "other"),
            { title: "Balance", field: "balance", hozAlign: "right", sorter: "number", formatter: function (cell) {
                const value = cell.getValue();
                const color = value > 0 ? "#059669" : (value < 0 ? "#e11d48" : "inherit");
                return '<span style="color:' + color + ';font-weight:600">' + signedPct(value) + "</span>";
            } },
            { title: "US share", field: "usShare", hozAlign: "right", sorter: "number", formatter: function (cell) { return pct(cell.getValue()); } },
            { title: "Top buyer", field: "topBuyer", minWidth: 110 }
        ],
        onRowClick: function (row) { setFilters({ industry: row.code }); }
    }, rows);
}

function addReportMenus() {
    if (typeof addPanelMenu !== "function") return;
    const filename = function (name) { return name + "-" + appState.selectedState + "-" + DATA_YEAR + ".csv"; };
    [
        { panel: "partnerPanel", table: "partner", name: "partner-states" },
        { panel: "dependencyPanel", table: "dependency", name: "import-dependency" },
        { panel: "advantagePanel", table: "advantage", name: "competitive-advantage", hide: true }
    ].forEach(function (entry) {
        const menuItems = [{ label: "Download CSV", action: "dep-download", icon: "download" }];
        if (entry.hide) menuItems.push({ label: "Hide report", action: "dep-hide", icon: "visibility_off" });
        menuItems.push({ label: "About these measures", action: "dep-about", icon: "info" });
        addPanelMenu({
            panelType: "Content",
            targetPanelId: entry.panel,
            containerSelector: "#" + entry.panel + "MenuHolder",
            inline: true,
            menuItems: menuItems,
            onAction: function (action) {
                if (action === "dep-download") downloadTable(entry.table, filename(entry.name));
                else if (action === "dep-hide") setFilters({ showAdvantage: false, report: appState.report === "advantage" ? "dependency" : appState.report });
                else if (action === "dep-about") document.getElementById("readmeDiv").scrollIntoView({ behavior: "smooth" });
                else return false;
                return true;
            }
        }).render();
    });
}

renderTradeVizLinks(document.getElementById("trade-viz-links"));
// The map view tabs take the place of this page's own button among the trade buttons
(function () {

// ---- Side panel tabs, and where the filter bar sits ----
// The panel starts closed. The tab left open, and the filter bar's place, are kept in localStorage.

const PANEL_TAB_KEY = "tradeDependency.panelTab";
const FILTER_DOCK_KEY = "tradeDependency.filterDock";
const PANEL_TABS = ["states", "filters"];
const statePanel = document.querySelector(".state-panel");
const filterBar = document.getElementById("filter-bar");
const filterDockBtn = document.getElementById("filter-dock-btn");

function storageGet(key) {
    try { return localStorage.getItem(key) || ""; } catch (error) { return ""; }
}

function storageSet(key, value) {
    try {
        if (value) localStorage.setItem(key, value); else localStorage.removeItem(key);
    } catch (error) {
        // localStorage unavailable
    }
}

let panelTab = PANEL_TABS.indexOf(storageGet(PANEL_TAB_KEY)) >= 0 ? storageGet(PANEL_TAB_KEY) : "";
let filterDock = storageGet(FILTER_DOCK_KEY) === "top" ? "top" : "panel";

function setPanelTab(tab) {
    panelTab = tab;
    storageSet(PANEL_TAB_KEY, tab);
    syncPanel();
}

function syncPanel() {
    statePanel.dataset.open = panelTab ? "true" : "false";
    statePanel.querySelectorAll(".panel-tab").forEach(function (button) {
        const active = button.getAttribute("data-tab") === panelTab;
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
    });
    statePanel.querySelectorAll(".panel-body").forEach(function (body) {
        body.hidden = body.getAttribute("data-tab-body") !== panelTab;
    });
    if (panelTab === "states") keepSelectedInList();
}

function setFilterDock(dock) {
    filterDock = dock;
    storageSet(FILTER_DOCK_KEY, dock === "top" ? "top" : "");
    syncFilterDock();
}

// Moves the one filter bar, so its controls keep their listeners
function syncFilterDock() {
    const onTop = filterDock === "top";
    const target = onTop ? document.getElementById("filter-dock-top") : document.getElementById("filter-dock-panel");
    if (filterBar.parentElement !== target) target.appendChild(filterBar);
    filterBar.classList.toggle("glass", onTop);
    document.getElementById("filter-dock-note").hidden = !onTop;
    filterDockBtn.innerHTML = onTop
        ? '<i class="material-icons">vertical_align_bottom</i>Move to side panel'
        : '<i class="material-icons">vertical_align_top</i>Show above map';
    filterDockBtn.title = onTop ? "Move the filters into the side panel" : "Show the filters above the map";
}

statePanel.querySelectorAll(".panel-tab").forEach(function (button) {
    button.addEventListener("click", function () {
        const tab = button.getAttribute("data-tab");
        setPanelTab(tab === panelTab ? "" : tab);
    });
});
statePanel.querySelector(".panel-close").addEventListener("click", function () { setPanelTab(""); });
filterDockBtn.addEventListener("click", function () {
    setFilterDock(filterDock === "top" ? "panel" : "top");
    if (filterDock === "top" && panelTab === "filters") setPanelTab("");
});
document.querySelector("#filter-dock-note [data-dock]").addEventListener("click", function () { setFilterDock("panel"); });
syncFilterDock();
syncPanel();

function renderOptions() {
    stateSelect.innerHTML = appState.stateCodes.map(function (code) {
        return '<option value="' + code + '">' + escapeHtml(stateLabel(code)) + " (" + code + ")</option>";
    }).join("");
    industrySelect.innerHTML = '<option value="' + ALL + '">All industries</option>' + appState.industries.map(function (code) {
        return '<option value="' + code + '">' + escapeHtml(industryLabel(code)) + "</option>";
    }).join("");
    metricSelect.innerHTML = Object.keys(METRICS).map(function (key) {
        return '<option value="' + key + '">' + escapeHtml(METRICS[key].label) + "</option>";
    }).join("");
}

function syncControls() {
    document.querySelectorAll("#report-mode button").forEach(function (button) {
        const active = button.getAttribute("data-report") === appState.report;
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
    });
    stateSelect.value = appState.selectedState;
    document.getElementById("selected-state-report-action").innerHTML = stateReportAction(appState.selectedState);
    industrySelect.value = appState.industry;
    metricSelect.value = appState.metric;
    directionSelect.value = appState.direction;
    document.getElementById("direction-wrap").hidden = appState.report !== "flows";
    const measures = measureDefs();
    document.getElementById("measure-wrap").hidden = appState.report === "flows";
    measureSelect.innerHTML = Object.keys(measures).map(function (key) {
        return '<option value="' + key + '">' + escapeHtml(measures[key].label) + "</option>";
    }).join("");
    measureSelect.value = appState.measure;
    advantageToggle.checked = appState.showAdvantage;
    advantageToggle.closest(".report-toggle").hidden = appState.report !== "flows";
}

document.querySelectorAll("#report-mode button").forEach(function (button) {
    button.addEventListener("click", function () {
        const report = button.getAttribute("data-report");
        if (report === appState.report) return;
        setFilters({ report: report, measure: DEFAULT_MEASURE[report] || "" });
    });
});
stateSelect.addEventListener("change", function () { setFilters({ selectedState: this.value }); });
industrySelect.addEventListener("change", function () { setFilters({ industry: this.value }); });
metricSelect.addEventListener("change", function () { setFilters({ metric: this.value }); });
directionSelect.addEventListener("change", function () { setFilters({ direction: this.value }); });
measureSelect.addEventListener("change", function () { setFilters({ measure: this.value }); });
advantageToggle.addEventListener("change", function () {
    setFilters({ showAdvantage: this.checked });
    if (this.checked) document.getElementById("advantagePanel").scrollIntoView({ behavior: "smooth", block: "nearest" });
});
document.getElementById("clear-filters-btn").addEventListener("click", function () {
    try { localStorage.removeItem(FILTER_STORAGE_KEY); } catch (error) {}
    const reportChanged = appState.report !== FILTER_DEFAULTS.report;
    applyFilters({});
    appState.visiblePartners = new Set();
    commitFilters(reportChanged);
});

window.addEventListener("resize", function () {
    Object.values(charts).forEach(function (chart) { chart.resize(); });
});

// Restyle the map and charts when the site switches between light and dark
let renderedDark = isDark();
new MutationObserver(function () {
    if (isDark() === renderedDark) return;
    renderedDark = isDark();
    syncTiles();
    renderAll();
}).observe(document.body, { attributes: true, attributeFilter: ["class"] });

function renderAll() {
    if (!appState.flows) return;
    syncControls();
    const view = buildView();
    currentView = view;
    renderStateList(view);
    styleStates();
    drawOverlay();
    renderLegend(view);
    renderFilterNote(view);
    renderSummary(view);
    renderPartnerReport(view);
    barMax.share = 1;
    const rows = industryRows();
    renderDependencyReport(rows);
    renderAdvantageReport(rows);
}

async function init() {
    try {
        const files = StateFlows.FILES;
        const [tradeUsText, industryCategoryText, categoryStateText, ratesText, stateCodesText, topoData] = await Promise.all([
            fetchTradeData(files.tradeUs),
            fetchTradeData(files.industryCategory),
            fetchTradeData(files.categoryState),
            fetchTradeData(files.eurRates).catch(function () { return ""; }),
            fetchTradeData(files.stateCodes),
            fetch(TOPOJSON_URL).then(function (response) {
                if (!response.ok) throw new Error("Unable to load state geometry");
                return response.json();
            })
        ]);
        d3.csvParse(stateCodesText).forEach(function (row) {
            const code = normalizeCode(row.state_code);
            if (!code) return;
            appState.stateNames.set(code, String(row.state_name || code).trim());
            appState.stateCodes.push(code);
        });
        appState.usdPerEur = ratesText ? StateFlows.parseUsdPerEur(ratesText) : null;
        buildData(tradeUsText, industryCategoryText, categoryStateText);
        renderOptions();
        applyFilters(hashFilters() || readFilterCache());
        writeFilterCache();
        pushFiltersToHash();
        syncTiles();
        buildStateMap(topoData);
        addReportMenus();
        document.addEventListener("hashChangeEvent", handleHashChange);
        renderAll();
    } catch (error) {
        console.error(error);
        document.getElementById("status-msg").textContent = "Unable to load state trade data: " + error.message;
        document.getElementById("filter-note").textContent = "The page looks for a trade-data folder in the webroot, then GitHub's copy.";
    }
}

init();
