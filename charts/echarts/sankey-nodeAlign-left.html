<!DOCTYPE html>
<html lang="en" style="height: 100%">
<head>
  <meta charset="utf-8" />
  <title>Profile - EEIO Labels</title>
  <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/localsite/css/base.css" id="/localsite/css/base.css" />
  <script type="text/javascript" src="/localsite/js/localsite.js?showheader=true"></script>
</head>
<body style="height: 100%; margin: 30px">
  <div class="content">
    <a href="../../trade/">Trade Flow SQL</a><br>
    <h1>Sankey Chart Dev</h1>


  </div>

  <div id="container" style="height: calc(100vh - 60px); width: 100%"></div>

  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  
  <!-- Uncomment this line if you want to dataTool extension
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/extension/dataTool.min.js"></script>
  -->
  <!-- Uncomment this line if you want to use gl extension
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts-gl@2/dist/echarts-gl.min.js"></script>
  -->
  <!-- Uncomment this line if you want to echarts-stat extension
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts-stat@latest/dist/ecStat.min.js"></script>
  -->
  <!-- Uncomment this line if you want to use map
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>
  -->
  <!-- Uncomment these two lines if you want to use bmap extension
  <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=YOUR_API_KEY"></script>
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/extension/bmap.min.js"></script>
  -->

  <script type="text/javascript">
    var dom = document.getElementById('container');
    var myChart = echarts.init(dom);
    var isFullscreen = false;

    $.get("IO.json", function (data) {
      function getChartOption() {
        return {
          title: {
            text: 'Node Align Left'
          },
          tooltip: {
            trigger: 'item',
            triggerOn: 'mousemove'
          },
          toolbox: {
            feature: {
              myFullscreen: {
                show: true,
                title: isFullscreen ? 'Exit Fullscreen' : 'Fullscreen',
                icon: 'path://M128 320v128h128v-32h-96v-96h-32zM352 320h-32v96h-96v32h128v-128zM128 192h32v-96h96v-32h-128v128zM448 192v-128h-128v32h96v96h32z',
                onclick: function() {
                  const container = document.getElementById('container');
                  if (!isFullscreen) {
                    if (container.requestFullscreen) {
                      container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                      container.webkitRequestFullscreen();
                    } else if (container.msRequestFullscreen) {
                      container.msRequestFullscreen();
                    }
                  } else {
                    if (document.exitFullscreen) {
                      document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                      document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                      document.msExitFullscreen();
                    }
                  }
                }
              },
              restore: { show: true, title: 'Reset' },
              saveAsImage: { show: true, title: 'Save as Image' }
            },
            right: 10,
            top: 10
          },
          series: [{
            type: 'sankey',
            nodeAlign: 'left',
            data: data.nodes,
            links: data.links,
            emphasis: { focus: 'adjacency' },
            lineStyle: {
              color: 'source',
              curveness: 0.5
            },
            label: {
              show: isFullscreen,
              position: 'right',
              fontSize: 11,
              color: '#333',
              formatter: '{b}'
            },
            left: isFullscreen ? '0.5%' : '1%',
            right: isFullscreen ? '12%' : '1%',
            top: isFullscreen ? '0.5%' : '1%',
            bottom: isFullscreen ? '0.5%' : '1%',
            nodeGap: 8,
            nodeWidth: 20,
            layoutIterations: 32
          }]
        };
      }

      myChart.setOption(getChartOption());
      myChart.resize();

      // Listen for fullscreen changes
      function onFullscreenChange() {
        isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
        myChart.setOption(getChartOption());
        setTimeout(() => myChart.resize(), 100);
      }

      document.addEventListener('fullscreenchange', onFullscreenChange);
      document.addEventListener('webkitfullscreenchange', onFullscreenChange);
      document.addEventListener('msfullscreenchange', onFullscreenChange);
    });

    window.addEventListener('resize', () => myChart.resize());
  </script>

</body>
</html>
